<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width">
	<title>邱思航♡王晓慧婚礼请柬</title>
	<link rel="stylesheet" href="./style.css" type="text/css" media="all">
</head>

<body>
	<div style="display:none;"><img src="images/thumbnail.jpg" alt=""></div>

	<div id="cover" onclick="click_cover()" ontouchend="click_cover()">
		<div style="position:absolute;top:50%;left:50%;width:100%;transform:translate(-50%, -50%);">
			<center><img style="max-width:100%;max-height:100vh" src="images/cover.jpg"/></center>
		</div>
	</div>

	<div id="mainbody" style="display:none">
		<div style="position:fixed;z-index:20;bottom:70px;width:100%;">
			<audio id="music" controls style="opacity:0.5;position:absolute;top:0px;left:50%;height:50px;width:200px;transform:translate(-100px,0);">
				<source src="Liebestraume.mp3" type="audio/mpeg">
			</audio>
		</div>
		<div id="content">
			<div style="position:absolute;top:50%;left:50%;width:95%;transform:translate(-50%, -50%);">
				<center><img style="max-width:100%;max-height:100vh" src="images/content.jpg"/></center>
			</div>
		</div>

		<div id="album" style="padding:30px">
			<img style="width:100%" src="images/photos/welcome1.jpg"/>
			<br/><br/><hr><br/><br/>
			<img style="width:100%" src="images/photos/life1.jpg"/>
			<br/><br/>
			<img style="width:100%" src="images/photos/wedding.jpg"/>
			<br/><br/>
			<img style="width:100%" src="images/photos/life2.jpg"/>
			<br/><br/><hr><br/><br/>
			<img style="width:100%" src="images/photos/welcome2.jpg"/>
		</div>

		<div style="width:100%;text-align:center">
			<a href="https://surl.amap.com/79kv0LJ3h2c" target="_blank">
			<img width="300" style="border:1px solid black;border-radius:10px" src="images/map.png"/>
		</a><br/>
			<span style="font-size:10px">地址：衢州市柯城区三衢路478号<br/><br/></span>
		</div>

		<div class="header" style="padding-top:20px; padding-bottom:20px; background:#f2f2f2; color:#999999">
			&#169; <script type="text/javascript">document.write( new Date().getFullYear() );</script> Sihang & Xiaohui.
		</div>
	</div>

	<script>
	var click_cover = function() {
		document.getElementById("mainbody").style.display = "block";
		document.getElementById("cover").style.display = "none";
		document.getElementById("music").play();
	}
	</script>

</body>

</html>
